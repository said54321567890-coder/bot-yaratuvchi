<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boshqaruv paneli</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --bg2:var(--tg-theme-secondary-bg-color,#f1f1f4);
  --text:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#8a8a90);
  --btn:var(--tg-theme-button-color,#2481cc);
  --btnt:var(--tg-theme-button-text-color,#fff);
  --ok:#2fa84f;--off:#b0b0b8;
}
*{box-sizing:border-box}
body{margin:0;padding:14px 14px 28px;background:var(--bg2);color:var(--text);font:15px/1.4 -apple-system,system-ui,Roboto,sans-serif}
h1{font-size:20px;margin:4px 2px 2px}
.sub{color:var(--hint);margin:0 2px 14px}
.top{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--bg);border-radius:14px;padding:12px}
.stat b{display:block;font-size:20px}
.stat span{color:var(--hint);font-size:13px}
.card{background:var(--bg);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.name{font-weight:600;font-size:16px;word-break:break-word}
.uname{color:var(--hint);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag{background:var(--bg2);border-radius:8px;padding:3px 8px;font-size:12px}
.tag.warn{color:#d33}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sl{position:absolute;inset:0;background:var(--off);border-radius:28px;transition:.2s}
.sl:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+.sl{background:var(--ok)}
.sw input:checked+.sl:before{transform:translateX(18px)}
label.lb{display:block;color:var(--hint);font-size:13px;margin:8px 0 4px}
textarea{width:100%;min-height:84px;border:1px solid var(--bg2);background:var(--bg2);color:var(--text);border-radius:10px;padding:10px;font:inherit;resize:vertical}
button.save{margin-top:8px;width:100%;border:0;border-radius:10px;padding:11px;background:var(--btn);color:var(--btnt);font:inherit;font-weight:600}
button.save:disabled{opacity:.5}
.empty,.msg{text-align:center;color:var(--hint);padding:30px 10px}
</style>
</head>
<body>
<h1 id="hi">Boshqaruv paneli</h1>
<p class="sub">Botlaringiz va sozlamalar</p>
<div id="app"><div class="msg">Yuklanmoqda…</div></div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const app = document.getElementById('app');

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
async function api(path, body){
  const opt = {headers: {'X-Init-Data': tg ? tg.initData : ''}};
  if (body){ opt.method = 'POST'; opt.body = JSON.stringify(body); opt.headers['Content-Type'] = 'application/json'; }
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function daysLeft(ts){
  if (!ts) return null;
  return Math.ceil((ts * 1000 - Date.now()) / 86400000);
}
function card(b){
  const c = el('div', 'card');
  const top = el('div', 'row');
  const left = el('div');
  left.appendChild(el('div', 'name', b.title || (b.username ? '@' + b.username : 'Bot')));
  if (b.username) left.appendChild(el('div', 'uname', '@' + b.username));
  const sw = el('label', 'sw');
  const cb = el('input'); cb.type = 'checkbox'; cb.checked = b.active;
  sw.appendChild(cb); sw.appendChild(el('span', 'sl'));
  top.appendChild(left); top.appendChild(sw);
  c.appendChild(top);

  const tags = el('div', 'tags');
  if (b.plan) tags.appendChild(el('span', 'tag', '⭐ ' + b.plan));
  if (b.engine) tags.appendChild(el('span', 'tag', b.engine));
  tags.appendChild(el('span', 'tag', '👥 ' + b.users));
  if (b.limit) tags.appendChild(el('span', 'tag', 'Limit: ' + b.limit));
  const d = daysLeft(b.expires);
  if (d !== null) tags.appendChild(el('span', 'tag' + (d <= 3 ? ' warn' : ''), d > 0 ? '⏳ ' + d + ' kun qoldi' : '⏳ Muddati tugagan'));
  c.appendChild(tags);

  c.appendChild(el('label', 'lb', 'Xush kelibsiz xabari'));
  const ta = el('textarea'); ta.value = b.welcome; ta.maxLength = 1000;
  c.appendChild(ta);
  const btn = el('button', 'save', 'Saqlash');
  c.appendChild(btn);

  cb.addEventListener('change', async () => {
    cb.disabled = true;
    try { await api('/api/bot', {id: b.id, active: cb.checked}); }
    catch (e) { cb.checked = !cb.checked; alert('Xatolik, qayta urinib ko\'ring'); }
    cb.disabled = false;
  });
  btn.addEventListener('click', async () => {
    const v = ta.value.trim();
    if (!v) { alert('Xabar bo\'sh bo\'lmasin'); return; }
    btn.disabled = true;
    try { await api('/api/bot', {id: b.id, welcome: v}); btn.textContent = 'Saqlandi ✓'; }
    catch (e) { btn.textContent = 'Xatolik'; }
    setTimeout(() => { btn.textContent = 'Saqlash'; btn.disabled = false; }, 1500);
  });
  return c;
}
async function load(){
  if (!tg || !tg.initData){
    app.replaceChildren(el('div', 'msg', 'Bu sahifani Telegram ichidan oching.'));
    return;
  }
  try {
    const me = await api('/api/me');
    if (me.user.name) document.getElementById('hi').textContent = 'Salom, ' + me.user.name + '!';
    const top = el('div', 'top');
    const s1 = el('div', 'stat'); s1.appendChild(el('b', '', String(me.bots.length))); s1.appendChild(el('span', '', 'Botlar'));
    const s2 = el('div', 'stat'); s2.appendChild(el('b', '', Number(me.balance || 0).toLocaleString('ru-RU'))); s2.appendChild(el('span', '', 'Balans'));
    top.appendChild(s1); top.appendChild(s2);
    const nodes = [top];
    if (!me.bots.length) nodes.push(el('div', 'empty', 'Sizda hali bot yo\'q.'));
    me.bots.forEach(b => nodes.push(card(b)));
    app.replaceChildren(...nodes);
  } catch (e) {
    app.replaceChildren(el('div', 'msg', e.message === '401' ? 'Kirish rad etildi. Mini appni botingiz orqali oching.' : 'Yuklashda xatolik. Keyinroq urinib ko\'ring.'));
  }
}
load();
</script>
</body>
</html>
